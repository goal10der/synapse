[config]
# Global settings (mandatory)
default_mode = 'dark'
default_type = 'scheme-tonal-spot'

[templates.colors]
input_path = '/home/tim/.config/matugen/templates/colors.css'
output_path = '/home/tim/.cache/matugen/colors.css'

[templates.foot]
input_path = '~/.config/matugen/templates/foot.conf'
output_path = '~/.config/foot/colors.ini'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.conf'
output_path = '~/.config/hypr/colors/colors.conf'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3.css'
output_path = '~/.config/gtk-3.0/gtk.css'